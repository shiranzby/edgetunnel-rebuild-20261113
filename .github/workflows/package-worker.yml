name: Package Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker.js'
      - 'gateway-worker.js'
      - 'node-worker.js'
      - '*-worker.js'
      - 'page*.js'
      - 'panel-*.js'
      - 'scripts/vendor-panel.mjs'
      - 'page.js'
      - 'upstream/**'
      - 'data/snapshot.js'
      - 'wrangler*.toml'
      - '.github/workflows/package-worker.yml'

permissions:
  contents: write

jobs:
  package-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Package worker file
        run: |
          rm -f worker.zip
          zip -9 worker.zip worker.js subscription-worker.js gateway-worker.js node-worker.js panel-worker.js panel-auth.js panel-view.js panel-view-no-script1.js panel-cfst-worker.js page.js page-bootstrap2.js admin-worker.js login-worker.js session-worker.js public-worker.js wrangler.toml wrangler.gateway.toml data/snapshot.js upstream/cmliu-worker.js upstream/zitianya9110-worker.js upstream/panel.html upstream/panel-template.js upstream/panel-template-no-script1.js scripts/vendor-panel.mjs README.md LICENSE

      - name: Commit packaged worker
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: package worker.zip'
          file_pattern: worker.zip
